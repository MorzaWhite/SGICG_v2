<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Orden</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10">
        <div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold mb-6">Crear Nueva Orden</h1>

            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 px-4 py-2 rounded font-medium text-white {% if message.tags == 'success' %}bg-green-500{% else %}bg-red-500{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label for="{{ form.tipo_certificado.id_for_label }}" class="block text-sm font-medium text-gray-700">Tipo de Certificado</label>
                        {{ form.tipo_certificado }}
                    </div>
                    <div>
                        <label for="{{ form.color_gema.id_for_label }}" class="block text-sm font-medium text-gray-700">Color de Gema</label>
                        {{ form.color_gema }}
                    </div>
                    <div>
                        <label for="{{ form.peso.id_for_label }}" class="block text-sm font-medium text-gray-700">Peso (ct)</label>
                        {{ form.peso }}
                    </div>
                    <div>
                        <label for="{{ form.tipo_joya.id_for_label }}" class="block text-sm font-medium text-gray-700">Tipo de Joya (Opcional)</label>
                        {{ form.tipo_joya }}
                    </div>
                    <div>
                        <label for="{{ form.material_joya.id_for_label }}" class="block text-sm font-medium text-gray-700">Material de Joya (Opcional)</label>
                        {{ form.material_joya }}
                    </div>
                    <div class="flex items-center">
                        {{ form.tiene_seguro }}
                        <label for="{{ form.tiene_seguro.id_for_label }}" class="ml-2 block text-sm text-gray-900">¿Tiene Seguro?</label>
                    </div>
                    <div>
                        <label for="{{ form.tags.id_for_label }}" class="block text-sm font-medium text-gray-700">Tags</label>
                        {{ form.tags }}
                    </div>
                </div>
                <div class="mt-8">
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Crear Orden
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
